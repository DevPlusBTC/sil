# cargo-deny configuration v0.20 - minimal working config

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
unmaintained = "none"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unicode-TOU",
    "OpenSSL",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
]
multiple-versions = "allow"
skip = [
    "silc-frontend",
    "silc-causal-ir",
    "silc-backend",
    "silc-runtime",
    "silc-cli",
    "silc-test",
    "silc-lsp",
]
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []

[graph]
exclude = []