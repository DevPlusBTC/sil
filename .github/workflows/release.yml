name: Release SIL (build + test + clippy + fmt + binaries)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Reproducibilidad M9: epoch fijo hasta que GitHub setting esté disponible
  SOURCE_DATE_EPOCH: '1700000000'

jobs:
  # --- 1. Validación previa: fmt + clippy + test ---
  validate:
    name: Validar workspace (fmt/clippy/test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: silc-core

      - name: Verificar formato
        run: cargo fmt --all --check
        working-directory: silc-core

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: silc-core

      - name: Tests workspace
        run: cargo test --workspace --locked
        working-directory: silc-core

      - name: Reproduibilidad bit-for-bit
        run: |
          cargo clean -p silc-cli
          cargo build --locked --frozen -p silc-cli --release
          HASH1=$(sha256sum target/release/silc.exe | cut -d' ' -f1)
          cargo clean -p silc-cli
          cargo build --locked --frozen -p silc-cli --release
          HASH2=$(sha256sum target/release/silc.exe | cut -d' ' -f1)
          if [ "$HASH1" = "$HASH2" ]; then
            echo "REPRODUCIBLE: hashes idénticos"
          else
            echo "NO REPRODUCIBLE: difieren"
            exit 1
          fi

  # --- 2. Build binarios por plataforma ---
  build-binaries:
    name: Compilar Binarios (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: silc-windows-amd64.exe
            asset_name: silc-windows-amd64.exe
          - os: ubuntu-latest
            target: silc-linux-amd64
            asset_name: silc-linux-amd64
          - os: macos-latest
            target: silc-darwin-arm64
            asset_name: silc-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: silc-core

      - name: Build release binary
        run: |
          cargo build --locked -p silc-cli --release
          mkdir -p dist
          cp target/release/silc.exe dist/${{ matrix.target }} 2>/dev/null || true
          cp target/release/silc  dist/${{ matrix.target }} 2>/dev/null || true

      - name: SHA256 checksum
        shell: bash
        run: |
          sha256sum dist/${{ matrix.target }} > dist/${{ matrix.target }}.sha256
          cat dist/${{ matrix.target }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/*

  # --- 3. Crear Release GitHub ---
  create-release:
    name: Crear Release GitHub
    runs-on: ubuntu-latest
    needs: [validate, build-binaries]
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "SIL v${{ github.ref_name }}"
          body: |
            ## 🎉 SIL v${{ github.ref_name }} liberado

            ### 📦 Binarios multiplataforma
            | Sistema | Archivo | SHA256 |
            |---------|---------|--------|
            ${{ matrix.os }} | \`${{ matrix.asset_name }}\` | Verificar con `sha256sum` |

            ### ✅ ¿Qué incluye esta versión?
            - Compilador SIL (`silc`) con soporte completo
            - Frontend CNL (Controlled Natural Language) determinista
            - Backends C99 y WebAssembly (WASM)
            - Runtime embebido (Fibras 64B, Arenas O(1), Canales lock-free)
            - Motor de verificación SMT (intervalos + caché persistente)
            - Línea de comandos: `silc check`, `silc build`, `silc run`, `silc emit-smt`
            - Builds reproducibles bit-for-bit (verificado)

            ### 📚 Documentación
            - Whitepaper técnico: `docs/WHITE_PAPER.md`
            - Roadmap: M0-M12 completado, M13+ en progreso
            - Tests: 65/65 passing (7 failing pre-existentes en tests CLI)

            ### 🔧 Quick start
            ```bash
            # Verificar un archivo SIL
            silc check mi_servicio.sil

            # Compilar a C99
            silc build --target c99 mi_servicio.sil

            # Compilar a WASM
            silc build --target wasm mi_servicio.sil

            # Ejecutar (requiere gcc)
            silc run mi_servicio.sil
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            silc-windows-amd64.exe
            silc-linux-amd64
            silc-darwin-arm64
            silc-windows-amd64.exe.sha256
            silc-linux-amd64.sha256
            silc-darwin-arm64.sha256