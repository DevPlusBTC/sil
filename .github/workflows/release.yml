name: Release SIL (binarios + atestación de procedencia)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a publicar (p. ej. v0.3.0)'
        required: true
        type: string
      prerelease:
        description: 'Marcar como pre-release'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  # Build reproducible: misma entrada + mismo toolchain => mismo binario.
  CARGO_PROFILE_RELEASE_LTO: fat
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  # --- 1. Validación: fmt + clippy + test + audit + deny + reproducibilidad ---
  validate:
    name: Validar workspace (fmt/clippy/test/audit/deny)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: silc-core

      - name: Verificar formato
        run: cargo fmt --all --check
        working-directory: silc-core

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: silc-core

      - name: Tests workspace
        run: cargo test --workspace --all-targets --locked
        working-directory: silc-core

      - name: Install cargo-audit y cargo-deny
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked

      - name: cargo-audit (vulnerabilidades)
        run: cargo audit
        working-directory: silc-core

      - name: cargo-deny (licencias, bans, fuentes)
        run: cargo deny --config ../deny.toml check
        working-directory: silc-core

      - name: Reproducibilidad bit-for-bit
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          hash_bin() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum target/release/silc
            else
              shasum -a 256 target/release/silc
            fi
          }
          cargo clean -p silc-cli
          cargo build --locked -p silc-cli --release
          HASH1="$(hash_bin | cut -d' ' -f1)"
          cargo clean -p silc-cli
          cargo build --locked -p silc-cli --release
          HASH2="$(hash_bin | cut -d' ' -f1)"
          if [ "$HASH1" = "$HASH2" ]; then
            echo "REPRODUCIBLE: hashes idénticos ($HASH1)"
          else
            echo "NO REPRODUCIBLE: $HASH1 != $HASH2"
            exit 1
          fi
        working-directory: silc-core

  # --- 2. Build binarios multiplataforma + SBOM + atestación ---
  build-binaries:
    name: Compilar binario (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: silc-windows-x64
            ext: .exe
          - os: ubuntu-latest
            artifact: silc-linux-x64
            ext: ''
          - os: macos-latest
            artifact: silc-macos-arm64
            ext: ''

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: silc-core

      - name: Fijar SOURCE_DATE_EPOCH al commit
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --locked -p silc-cli --release
        working-directory: silc-core

      - name: Preparar artefacto (copia + sha256)
        shell: bash
        run: |
          set -euo pipefail
          DEST="${{ matrix.artifact }}${{ matrix.ext }}"
          mkdir -p dist
          cp "target/release/silc${{ matrix.ext }}" "dist/$DEST"
          if command -v sha256sum >/dev/null 2>&1; then
            ( cd dist && sha256sum "$DEST" > "$DEST.sha256" )
          else
            ( cd dist && shasum -a 256 "$DEST" > "$DEST.sha256" )
          fi
          cat "dist/$DEST.sha256"
        working-directory: silc-core

      - name: Preparar entrada SBOM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sbom-src"
          cp Cargo.lock "$RUNNER_TEMP/sbom-src/Cargo.lock"
        working-directory: silc-core

      - name: Generar SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: ${{ runner.temp }}/sbom-src
          format: cyclonedx-json
          output-file: silc-core/dist/sbom-${{ matrix.artifact }}.json
          upload-artifact: false
          upload-release-assets: false

      - name: Atestar procedencia del build
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: silc-core/dist/${{ matrix.artifact }}${{ matrix.ext }}

      - name: Upload artefactos
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: silc-core/dist/*
          retention-days: 30

  # --- 3. Verificar la atestación antes de publicar ---
  verify-attestation:
    name: Verificar atestación de procedencia
    runs-on: ubuntu-latest
    needs: [build-binaries]
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Descargar binarios
        uses: actions/download-artifact@v4
        with:
          pattern: silc-*
          path: release-assets
          merge-multiple: true

      - name: Verificar con gh attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for f in release-assets/silc-windows-x64.exe release-assets/silc-linux-x64 release-assets/silc-macos-arm64; do
            gh attestation verify "$f" --repo "${{ github.repository }}"
          done

  # --- 4. Smoke test del binario Linux descargado del artifact ---
  smoke-test:
    name: Smoke test del binario publicado
    runs-on: ubuntu-latest
    needs: [build-binaries]
    steps:
      - name: Descargar binario Linux
        uses: actions/download-artifact@v4
        with:
          name: silc-linux-x64
          path: bin

      - name: Ejecutar CLI sobre un programa real
        run: |
          set -euo pipefail
          chmod +x bin/silc-linux-x64
          ./bin/silc-linux-x64 --version
          printf 'definir tarea hola() -> Entero64:\n    demostrar 1 > 0\n    retornar 42\n' > hola.sil
          ./bin/silc-linux-x64 check hola.sil
          ./bin/silc-linux-x64 build hola.sil --target c99 -o hola.c
          ./bin/silc-linux-x64 build hola.sil --target wasm -o hola.wasm
          ./bin/silc-linux-x64 emit-smt hola.sil > hola.smt2
          test -s hola.c
          test -s hola.wasm
          test -s hola.smt2

  # --- 5. Crear Release GitHub ---
  create-release:
    name: Publicar release
    runs-on: ubuntu-latest
    needs: [validate, build-binaries, verify-attestation, smoke-test]
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          pattern: silc-*
          path: release-assets
          merge-multiple: true

      - name: Listar assets
        run: |
          ls -la release-assets/
          cat release-assets/*.sha256

      - name: Crear Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: "SIL ${{ inputs.tag || github.ref_name }}"
          prerelease: ${{ inputs.prerelease || false }}
          body: |
            ## SIL ${{ inputs.tag || github.ref_name }}

            ### Binarios
            | Sistema | Archivo |
            |---------|---------|
            | Windows x64 | `silc-windows-x64.exe` |
            | Linux x64 | `silc-linux-x64` |
            | macOS ARM64 | `silc-macos-arm64` |

            Cada binario incluye su `.sha256`, un SBOM CycloneDX y una
            atestación de procedencia generada por GitHub Actions.

            ### Qué incluye
            - Compilador SIL (`silc`): `check`, `build`, `emit-smt`, `run`, `lsp`
            - Frontend CNL determinista (lexer + parser + spans reales)
            - Backends C99 y WebAssembly
            - Runtime embebido (arenas O(1), capacidades, fibras, canales)
            - Verificación SMT (intervalos + backend Z3 opcional)
            - Servidor LSP y extensión de VS Code
            - Builds reproducibles bit-for-bit (verificado en CI)

            ### Verificar integridad
            ```bash
            # Checksum
            sha256sum -c silc-linux-x64.sha256

            # Procedencia (GitHub CLI >= 2.49)
            gh attestation verify silc-linux-x64 --repo ${{ github.repository }}
            ```

            ### Documentación
            - Especificación: `docs/SPEC.md`
            - Whitepaper: `docs/WHITE_PAPER.md`
            - Guía de usuario: `docs/USER_GUIDE.md`
            - API: `docs/API.md`

            ### Inicio rápido
            ```bash
            silc check mi_servicio.sil
            silc build mi_servicio.sil --target c99 -o mi_servicio.c
            silc build mi_servicio.sil --target wasm -o mi_servicio.wasm
            silc emit-smt mi_servicio.sil
            ```
          generate_release_notes: false
          files: release-assets/*
