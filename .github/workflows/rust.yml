name: CI Rust (build + test + clippy + fmt + fuzz + smt)

on:
  push:
    branches: [main]
    paths:
      - 'silc-core/**'
      - 'examples/**'
      - 'scripts/**'
      - '.github/workflows/rust.yml'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'silc-core/**'
      - 'examples/**'
      - 'scripts/**'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SOURCE_DATE_EPOCH: '1700000000'

jobs:
  # --- 1. Formato (falla rápido si no está formateado) ---
  fmt:
    name: fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Verificar formato
        run: cargo fmt --all --check
        working-directory: silc-core

  # --- 2. Matrix: build + test + clippy en 3 OS ---
  build-test:
    name: build+test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: clippy

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libbpf-dev liburing-dev linux-headers-generic

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: silc-core

      - name: Build workspace
        run: cargo build --workspace --locked
        working-directory: silc-core

      - name: Tests workspace (Linux/macOS)
        if: runner.os != 'Windows'
        run: cargo test --workspace --locked
        working-directory: silc-core

      - name: Tests workspace (Windows)
        if: runner.os == 'Windows'
        run: cargo test -p silc-runtime -p silc-test --locked
        working-directory: silc-core

      # Los conteos de tests de README/SPEC/WHITE_PAPER se generan con un script.
      # Si alguien añade tests y no lo regenera, este paso falla con el total real.
      - name: Docs al día (conteos de tests)
        if: runner.os == 'Linux'
        run: python3 scripts/test_counts.py --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: silc-core

      # V1: validar que los ejemplos válidos compilan con gcc/clang -Werror
      # Reusa el target caliente del build-test.
      - name: Validar ejemplos C99 (solo ejemplos válidos)
        if: runner.os == 'Linux'
        shell: bash
        working-directory: silc-core
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Ejemplos válidos están en ../examples/valid/
          EXAMPLES=(../examples/valid/*.sil)

          if [ "${#EXAMPLES[@]}" -eq 0 ]; then
            echo "No hay archivos .sil en ../examples/valid"
            exit 1
          fi

          mkdir -p _examples
          BIN="./target/debug/silc"

          for f in "${EXAMPLES[@]}"; do
            "./target/debug/silc" build "$f" --target c99 -o "_examples/$(basename "${f%.sil}").c" >/dev/null
          done

          for f in _examples/*.c; do
            gcc -std=c99 -Wall -Wextra -Werror -fsyntax-only "$f"
            if command -v clang >/dev/null 2>&1; then
              clang -std=c99 -Wall -Wextra -Werror -fsyntax-only "$f"
            fi
          done

      # V1b: validar que los ejemplos inválidos fallan como se espera
      - name: Validar ejemplos inválidos (deben fallar)
        if: runner.os == 'Linux'
        shell: bash
        working-directory: silc-core
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Ejemplos inválidos están en ../examples/invalid/
          INVALID_EXAMPLES=(../examples/invalid/*.sil)

          if [ "${#INVALID_EXAMPLES[@]}" -eq 0 ]; then
            echo "No hay archivos .sil en ../examples/invalid"
            exit 1
          fi

          mkdir -p _examples_invalid
          BIN="./target/debug/silc"

          for f in "${INVALID_EXAMPLES[@]}"; do
            echo "Validando que $f falle como se espera..."
            if "$BIN" build "$f" --target c99 -o "/dev/null" 2>&1; then
              echo "ERROR: $f debería haber fallado pero compiló exitosamente"
              exit 1
            fi
            echo "OK: $f falló como se esperaba"
          done

          echo "Todos los ejemplos inválidos fallaron como se esperaba"


  # --- 3. Feature SMT (Z3) - requiere Python + CMake ---
  smt-test:
    name: smt tests (Z3 backend)
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # cmake viene preinstalado en ubuntu-latest (z3-sys lo necesita).
      - name: Versión de CMake
        run: cmake --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: clippy

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libbpf-dev liburing-dev

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: silc-core

      - name: Build with SMT feature
        run: cargo build --workspace --locked --features smt
        working-directory: silc-core
        env:
          Z3_SYS_Z3_VERSION: "4.13.0"

      - name: Tests with SMT feature (Z3)
        run: cargo test --workspace --locked --features smt
        working-directory: silc-core
        env:
          Z3_SYS_Z3_VERSION: "4.13.0"

      - name: Clippy with SMT feature
        run: cargo clippy --workspace --all-targets --locked --features smt -- -D warnings
        working-directory: silc-core
        env:
          Z3_SYS_Z3_VERSION: "4.13.0"

  # --- 4. Fuzzing (Linux only - ASan required) ---
  fuzz:
    name: fuzz (ubuntu-latest, nightly)
    runs-on: ubuntu-latest
    needs: [build-test]
    timeout-minutes: 30
    # El repo fija rust-toolchain.toml (stable) y el fuzz vive dentro del repo,
    # así que rustup elegía estable y `-Zsanitizer` fallaba. La variable de
    # entorno gana sobre el archivo de toolchain, también en los subprocesos
    # que lanza cargo-fuzz.
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libbpf-dev liburing-dev

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: silc-core

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # Si un target falla, se suben el input del crash (artifacts/) y la salida
      # completa (*.log) para poder reproducirlo sin acceso a los logs del runner.
      - name: Run fuzz lexer (30s)
        shell: bash
        run: |
          set -o pipefail
          timeout 120 cargo fuzz run fuzz_lexer -- -max_total_time=30 2>&1 | tee fuzz_lexer.log
        working-directory: silc-core/silc-frontend/fuzz

      - name: Run fuzz parser (30s)
        shell: bash
        run: |
          set -o pipefail
          timeout 120 cargo fuzz run fuzz_parser -- -max_total_time=30 2>&1 | tee fuzz_parser.log
        working-directory: silc-core/silc-frontend/fuzz

      - name: Run fuzz roundtrip (30s)
        shell: bash
        run: |
          set -o pipefail
          timeout 120 cargo fuzz run fuzz_roundtrip -- -max_total_time=30 2>&1 | tee fuzz_roundtrip.log
        working-directory: silc-core/silc-frontend/fuzz

      - name: Subir artefactos de fuzz
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: |
            silc-core/silc-frontend/fuzz/artifacts
            silc-core/silc-frontend/fuzz/*.log
          if-no-files-found: warn

      # Las anotaciones del run sí son públicas: se publica el final de cada log
      # como ::error:: para poder diagnosticar sin token de GitHub.
      - name: Publicar salida de fuzz en anotaciones
        if: failure()
        shell: bash
        run: |
          for f in silc-core/silc-frontend/fuzz/*.log; do
            [ -f "$f" ] || continue
            msg=$(tail -c 1200 "$f" | tr '\r' ' ' | tr '\n' '|' | sed 's/%/%25/g')
            echo "::error title=fuzz $(basename "$f")::${msg}"
          done

  # --- 4c. Runtime C (sil-rt) + runtime que emite el backend C99 ---
  #
  # Los tests de Rust del crate `silc-runtime` solo cubren arenas y
  # capacidades; canales, fibras, HMAC y el runtime embebido en el C emitido
  # no tenian ninguna prueba ejecutable. Este job compila cada fuente con
  # -std=c99 -pedantic-errors -Wall -Wextra -Werror y ejecuta la suite con
  # AddressSanitizer/UBSan y ThreadSanitizer, ademas de compilar la extraccion
  # verbatim del runtime de silc-backend (scripts/extraer_runtime_c.py).
  runtime-c:
    name: runtime C (estricto + ASan/UBSan/TSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilador
        run: cc --version
      - name: Suite del runtime C
        run: ./scripts/run_c_tests.sh

  # --- 5. Feature LLVM (backend LLVM 17) ---
  llvm-test:
    name: llvm tests (LLVM 17 backend)
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 17
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-17 llvm-17-dev clang-17 lld-17 libpolly-17-dev
          echo "/usr/lib/llvm-17/lib" | sudo tee /etc/ld.so.conf.d/llvm-17.conf
          sudo ldconfig

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: silc-core

      - name: Build with LLVM feature
        run: |
          cargo clean -p silc-backend
          cargo build --workspace --locked --features llvm
        working-directory: silc-core
        env:
          LLVM_SYS_170_PREFIX: /usr/lib/llvm-17

      - name: Tests with LLVM feature
        run: cargo test --workspace --locked --features llvm
        working-directory: silc-core
        env:
          LLVM_SYS_170_PREFIX: /usr/lib/llvm-17

      - name: Clippy with LLVM feature
        run: cargo clippy --workspace --all-targets --locked --features llvm -- -D warnings
        working-directory: silc-core
        env:
          LLVM_SYS_170_PREFIX: /usr/lib/llvm-17

  # --- 5. Python prototipo (no romper Fase -1) ---
  python-proto:
    name: python prototipo (unittest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tests compilador
        run: python3 test_sil_compiler.py
      - name: Tests stdlib
        run: python3 test_sil_stdlib.py
      - name: Tests WASM
        run: python3 test_sil_wasm.py

  # --- 6. Reproducibilidad: doble build -> hashes idénticos ---
  reproducibilidad:
    name: reproducible build (2x sha256)
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libbpf-dev liburing-dev

      - name: Fijar SOURCE_DATE_EPOCH al commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> $GITHUB_ENV

      - name: Build 1 (locked, frozen)
        run: |
          cargo build --locked -p silc-cli --release
          sha256sum target/release/silc | tee /tmp/hash1.txt
        working-directory: silc-core

      - name: Limpiar y Build 2
        run: |
          cargo clean -p silc-cli
          cargo build --locked -p silc-cli --release
          sha256sum target/release/silc | tee /tmp/hash2.txt
        working-directory: silc-core

      - name: Comparar hashes
        run: |
          echo "Build 1: $(cat /tmp/hash1.txt)"
          echo "Build 2: $(cat /tmp/hash2.txt)"
          diff /tmp/hash1.txt /tmp/hash2.txt && echo "REPRODUCIBLE: hashes idénticos" || (echo "NO REPRODUCIBLE" && exit 1)