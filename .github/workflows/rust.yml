name: CI Rust (build + test + clippy + fmt)

on:
  push:
    branches: [main]
    paths:
      - 'silc-core/**'
      - 'examples/**'
      - '.github/workflows/rust.yml'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'silc-core/**'
      - 'examples/**'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SOURCE_DATE_EPOCH: '1700000000'

jobs:
  # --- 1. Formato (falla rápido si no está formateado) ---
  fmt:
    name: fmt --check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Verificar formato
        run: cargo fmt --all --check
        working-directory: silc-core

  # --- 2. Build + test + clippy (ligero, < 3 min, memoria segura) ---
  build-test:
    name: build+test (ubuntu-latest)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      RUST_TEST_THREADS: 1
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: silc-core

      - name: Diagnostic memoria
        if: runner.os == 'Linux'
        run: |
          echo "=== Memoria disponible ==="
          free -h
          echo "=== Swap existente ==="
          swapon --show || echo "(sin swap activo)"
          echo "=== nproc ==="
          nproc

      - name: Build workspace
        run: |
          echo "=== Memoria antes de build ==="
          free -h || true
          echo "=== CPU info ==="
          nproc || true
          ulimit -a || true
          echo "=== Build individual por crate (con feature vendored para Z3) ==="
          set +e
          for crate in silc-frontend silc-backend silc-runtime silc-test silc-contracts; do
            echo "--- Build $crate ---"
            cargo build -p "$crate" --locked -j 1 > "/tmp/build_$crate.log" 2>&1
            CODE=$?
            if [ $CODE -ne 0 ]; then
              echo "::error title=\"Build failed: $crate\"::Exit code $CODE"
              echo "=== Errores de $crate ==="
              grep -i 'error\|panic\|failed' "/tmp/build_$crate.log" | tail -20
              exit $CODE
            fi
            echo "OK: $crate"
          done
          # silc-causal-ir y silc-cli: sin feature smt (evita requerir Z3)
          for crate in silc-causal-ir silc-cli; do
            echo "--- Build $crate (no default features) ---"
            cargo build -p "$crate" --locked --no-default-features -j 1 > "/tmp/build_$crate.log" 2>&1
            CODE=$?
            if [ $CODE -ne 0 ]; then
              echo "::error title=\"Build failed: $crate\"::Exit code $CODE"
              echo "=== Errores de $crate ==="
              grep -i 'error\|panic\|failed' "/tmp/build_$crate.log" | tail -20
              exit $CODE
            fi
            echo "OK: $crate"
          done
          echo "=== Build exitoso ==="
        working-directory: silc-core
        timeout-minutes: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /tmp/build_*.log

      - name: Tests workspace
        run: |
          echo "=== Memoria antes de tests ==="
          free -h || true
          echo "=== Tests por crate (sin feature smt) ==="
          set +e
          for crate in silc-frontend silc-backend silc-runtime silc-contracts; do
            echo "--- Test $crate ---"
            cargo test -p "$crate" --locked -- --test-threads=1 > "/tmp/test_$crate.log" 2>&1
            CODE=$?
            if [ $CODE -ne 0 ]; then
              echo "::error title=\"Test failed: $crate\"::Exit code $CODE"
              echo "=== Errores de $crate ==="
              grep -i 'error\|panic\|failed' "/tmp/test_$crate.log" | tail -20
              exit $CODE
            fi
            echo "OK: $crate"
          done
          # silc-causal-ir: tests sin feature smt
          echo "--- Test silc-causal-ir (no default features) ---"
          cargo test -p silc-causal-ir --locked --no-default-features -- --test-threads=1 > /tmp/test_silc-causal-ir.log 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then
            echo "::error title=\"Test failed: silc-causal-ir\"::Exit code $CODE"
            echo "=== Errores de silc-causal-ir ==="
            grep -i 'error\|panic\|failed' /tmp/test_silc-causal-ir.log | tail -20
            exit $CODE
          fi
          echo "OK: silc-causal-ir"
          echo "=== Tests exitosos ==="
        working-directory: silc-core
        timeout-minutes: 20

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: /tmp/test_*.log

      # Los conteos de tests de README/SPEC/WHITE_PAPER se generan con un script.
      # Si alguien añade tests y no lo regenera, este paso falla con el total real.
      - name: Clippy (deny warnings)
        run: |
          echo "=== Memoria antes de clippy ==="
          free -h || true
          # Ejecutar clippy por crate con cap-lints=allow para evitar panic
          for crate in silc-frontend silc-backend silc-runtime silc-causal-ir silc-test silc-contracts silc-cli; do
            echo "=== Clippy $crate ==="
            cargo clippy -p "$crate" --lib --bins --locked -j 1 -- --cap-lints=allow
          done
        working-directory: silc-core

      # V1: validar que los ejemplos válidos compilan con gcc/clang -Werror
      # Reusa el target caliente del build-test.
      - name: Validar ejemplos C99 (solo ejemplos válidos)
        if: runner.os == 'Linux'
        shell: bash
        working-directory: silc-core
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Ejemplos válidos están en ../examples/valid/
          EXAMPLES=(../examples/valid/*.sil)

          if [ "${#EXAMPLES[@]}" -eq 0 ]; then
            echo "No hay archivos .sil en ../examples/valid"
            exit 1
          fi

          mkdir -p _examples
          BIN="./target/debug/silc"

          for f in "${EXAMPLES[@]}"; do
            "./target/debug/silc" build "$f" --target c99 -o "_examples/$(basename "${f%.sil}").c" >/dev/null
          done

          for f in _examples/*.c; do
            gcc -std=c99 -Wall -Wextra -Werror -fsyntax-only "$f"
            if command -v clang >/dev/null 2>&1; then
              clang -std=c99 -Wall -Wextra -Werror -fsyntax-only "$f"
            fi
          done

      # V1b: validar que los ejemplos inválidos fallan como se espera
      - name: Validar ejemplos inválidos (deben fallar)
        if: runner.os == 'Linux'
        shell: bash
        working-directory: silc-core
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Ejemplos inválidos están en ../examples/invalid/
          INVALID_EXAMPLES=(../examples/invalid/*.sil)

          if [ "${#INVALID_EXAMPLES[@]}" -eq 0 ]; then
            echo "No hay archivos .sil en ../examples/invalid"
            exit 1
          fi

          mkdir -p _examples_invalid
          BIN="./target/debug/silc"

          for f in "${INVALID_EXAMPLES[@]}"; do
            echo "Validando que $f falle como se espera..."
            if "$BIN" build "$f" --target c99 -o "/dev/null" 2>&1; then
              echo "ERROR: $f debería haber fallado pero compiló exitosamente"
              exit 1
            fi
            echo "OK: $f falló como se esperaba"
          done

          echo "Todos los ejemplos inválidos fallaron como se esperaba"

  # --- 3. Python prototipo (ligero) ---
  python-proto:
    name: python prototipo (31 tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tests compilador
        run: python3 test_sil_compiler.py
      - name: Tests stdlib
        run: python3 test_sil_stdlib.py
      - name: Tests WASM
        run: python3 test_sil_wasm.py
# CI fix
