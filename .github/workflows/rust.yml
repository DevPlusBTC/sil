name: CI Rust (build + test + clippy + fmt + fuzz + smt)

on:
  push:
    branches: [main]
    paths:
      - 'silc-core/**'
      - '.github/workflows/rust.yml'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'silc-core/**'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SOURCE_DATE_EPOCH: '1700000000'

jobs:
  # --- 1. Formato (falla rápido si no está formateado) ---
  fmt:
    name: fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Verificar formato
        run: cargo fmt --all --check
        working-directory: silc-core

  # --- 2. Matrix: build + test + clippy en 3 OS ---
  build-test:
    name: build+test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: clippy

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libbpf-dev liburing-dev linux-headers-generic

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: silc-core

      - name: Build workspace
        run: cargo build --workspace --locked
        working-directory: silc-core

      - name: Tests workspace (Linux/macOS)
        if: runner.os != 'Windows'
        run: cargo test --workspace --locked
        working-directory: silc-core

      - name: Tests workspace (Windows)
        if: runner.os == 'Windows'
        run: cargo test -p silc-runtime -p silc-test --locked
        working-directory: silc-core

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: silc-core

  # --- 3. Feature SMT (Z3) - requiere Python + CMake ---
  smt-test:
    name: smt tests (Z3 backend)
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CMake
        uses: lukka/get-cmake@v3
        with:
          cmake-version: '3.25.0'

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: clippy

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libbpf-dev liburing-dev

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: silc-core

      - name: Build with SMT feature
        run: cargo build --workspace --locked --features smt
        working-directory: silc-core
        env:
          Z3_SYS_Z3_VERSION: "4.13.0"

      - name: Tests with SMT feature (Z3)
        run: cargo test --workspace --locked --features smt
        working-directory: silc-core
        env:
          Z3_SYS_Z3_VERSION: "4.13.0"

      - name: Clippy with SMT feature
        run: cargo clippy --workspace --all-targets --locked --features smt -- -D warnings
        working-directory: silc-core
        env:
          Z3_SYS_Z3_VERSION: "4.13.0"

  # --- 4. Fuzzing (Linux only - ASan required) ---
  fuzz:
    name: fuzz (ubuntu-latest, nightly)
    runs-on: ubuntu-latest
    needs: [build-test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libbpf-dev liburing-dev

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: silc-core

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run fuzz lexer (30s)
        run: cargo fuzz run fuzz_lexer -- -max_total_time=30
        working-directory: silc-core/silc-frontend/fuzz

      - name: Run fuzz parser (30s)
        run: cargo fuzz run fuzz_parser -- -max_total_time=30
        working-directory: silc-core/silc-frontend/fuzz

      - name: Run fuzz roundtrip (30s)
        run: cargo fuzz run fuzz_roundtrip -- -max_total_time=30
        working-directory: silc-core/silc-frontend/fuzz

  # --- 5. Python prototipo (no romper Fase -1) ---
  python-proto:
    name: python prototipo (31 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tests compilador
        run: python3 test_sil_compiler.py
      - name: Tests stdlib
        run: python3 test_sil_stdlib.py
      - name: Tests WASM
        run: python3 test_sil_wasm.py

  # --- 6. Reproducibilidad: doble build -> hashes idénticos ---
  reproducibilidad:
    name: reproducible build (2x sha256)
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libbpf-dev liburing-dev

      - name: Fijar SOURCE_DATE_EPOCH al commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> $GITHUB_ENV

      - name: Build 1 (locked, frozen)
        run: |
          cargo build --locked --frozen -p silc-cli --release
          sha256sum target/release/silc | tee /tmp/hash1.txt
        working-directory: silc-core

      - name: Limpiar y Build 2
        run: |
          cargo clean -p silc-cli
          cargo build --locked --frozen -p silc-cli --release
          sha256sum target/release/silc | tee /tmp/hash2.txt
        working-directory: silc-core

      - name: Comparar hashes
        run: |
          echo "Build 1: $(cat /tmp/hash1.txt)"
          echo "Build 2: $(cat /tmp/hash2.txt)"
          diff /tmp/hash1.txt /tmp/hash2.txt && echo "REPRODUCIBLE: hashes idénticos" || (echo "NO REPRODUCIBLE" && exit 1)